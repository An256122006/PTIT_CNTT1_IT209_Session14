
name: CI/CD - Build and Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE_NAME: trongan2006/devops-exam-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Spring Boot
        run: chmod +x gradlew && ./gradlew clean bootJar -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 5m
          script: |
            set -e

            echo "STEP 1: SSH CONNECTED"
            whoami
            hostname

            echo "STEP 2: ENTER PROJECT"
            cd ~/devops-exam/PTIT_CNTT1_IT209_Session14

            echo "STEP 3: GIT PULL"
            GIT_TERMINAL_PROMPT=0 git pull --ff-only origin master

            echo "STEP 4: CREATE ENV"
            cat > .env <<'EOF'
            MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_USER=${{ secrets.MYSQL_USER }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            DOCKER_IMAGE=${{ env.IMAGE_NAME }}:${{ github.sha }}
            SERVER_PORT=8080
            PAGE_SIZE_PRODUCTS=3
            EOF

            chmod 600 .env

            echo "STEP 5: DOCKER PULL"
            docker compose pull

            echo "STEP 6: DOCKER DEPLOY"
            docker compose up -d --remove-orphans

            echo "STEP 7: CHECK CONTAINERS"
            docker ps

            echo "DEPLOY COMPLETED"
