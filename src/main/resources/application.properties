spring.application.name=RestAPI_Session04
server.port=${SERVER_PORT:8080}

#Config datasource (ưu tiên biến môi trường từ .env / docker-compose, fallback chạy local)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_cntt3_api_ss4?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234$}

#Config jpa
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

#Config pagination
pageSizeProducts = ${PAGE_SIZE_PRODUCTS:3}